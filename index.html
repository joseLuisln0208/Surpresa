<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Surpresa pra Alice ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100dvh;
      background: linear-gradient(180deg, #ffeef2 0%, #ffc0cb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 20px;
    }

    /* Camada Periférica (Flores, Brilhos e Fotos Flutuantes) */
    .decor-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    /* ESTILO DAS 10 FOTOS FLUTUANTES */
    .floating-photo {
      position: absolute;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 20px rgba(190, 24, 93, 0.25);
      animation: floatPhoto 5s ease-in-out infinite alternate;
      pointer-events: auto;
    }

    .p1  { top: 7%;  left: 5%;  width: 52px; height: 52px; animation-delay: 0s; animation-duration: 4.5s; }
    .p2  { top: 10%; right: 6%; width: 60px; height: 60px; animation-delay: 1s; animation-duration: 5.2s; }
    .p3  { top: 26%; left: 3%;  width: 48px; height: 48px; animation-delay: 2s; animation-duration: 4.8s; }
    .p4  { top: 30%; right: 4%; width: 55px; height: 55px; animation-delay: 0.5s; animation-duration: 5.5s; }
    .p5  { top: 50%; left: 2%;  width: 50px; height: 50px; animation-delay: 1.5s; animation-duration: 4.2s; }
    .p6  { top: 53%; right: 3%; width: 54px; height: 54px; animation-delay: 2.5s; animation-duration: 5.0s; }
    .p7  { top: 72%; left: 4%;  width: 58px; height: 58px; animation-delay: 0.8s; animation-duration: 4.6s; }
    .p8  { top: 76%; right: 5%; width: 48px; height: 48px; animation-delay: 1.8s; animation-duration: 5.3s; }
    .p9  { top: 90%; left: 18%; width: 46px; height: 46px; animation-delay: 1.2s; animation-duration: 4.9s; }
    .p10 { top: 3%;  left: 42%; width: 48px; height: 48px; animation-delay: 2.2s; animation-duration: 5.1s; }

    @keyframes floatPhoto {
      0% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
      100% { transform: translateY(6px) rotate(-2deg); }
    }

    /* --- ESTILO DAS FLORES DE FUNDO --- */
    .flower {
      position: absolute;
      opacity: 0.7;
      animation: float 4s ease-in-out infinite alternate;
    }

    .petal-dark { fill: #be185d; }
    .petal-mid  { fill: #db2777; }
    .petal-core { fill: #fbcfe8; }
    .stem       { stroke: #2e7d32; stroke-width: 2; stroke-linecap: round; fill: none; }
    .leaf       { fill: #4caf50; }

    .f1  { top: 4%;   left: 4%;   width: 40px; height: 40px; animation-delay: 0s; }
    .f2  { top: 3%;   right: 5%;  width: 34px; height: 34px; animation-delay: 1.2s; transform: scaleX(-1); }
    .f3  { top: 18%;  left: 2%;   width: 32px; height: 32px; animation-delay: 0.5s; }
    .f4  { top: 22%;  right: 3%;  width: 38px; height: 38px; animation-delay: 2.1s; }
    .f5  { top: 45%;  left: 1%;   width: 36px; height: 36px; animation-delay: 1.8s; }
    .f6  { top: 48%;  right: 2%;  width: 30px; height: 30px; animation-delay: 0.3s; transform: scaleX(-1); }
    .f7  { top: 72%;  left: 3%;   width: 38px; height: 38px; animation-delay: 2.5s; }
    .f8  { top: 75%;  right: 4%;  width: 34px; height: 34px; animation-delay: 1.0s; }
    .f9  { bottom: 4%; left: 6%;  width: 36px; height: 36px; animation-delay: 0.7s; }
    .f10 { bottom: 3%; right: 8%; width: 40px; height: 40px; animation-delay: 1.5s; }

    /* --- ESTILO DOS BRILHOS --- */
    .sparkle {
      position: absolute;
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }

    .sparkle-gold  { fill: #facc15; opacity: 0.8; }
    .sparkle-white { fill: #ffffff; opacity: 0.9; }

    .s1 { top: 10%; left: 18%; width: 20px; height: 20px; animation-delay: 0.2s; }
    .s2 { top: 8%;  right: 20%; width: 24px; height: 24px; animation-delay: 1.1s; }
    .s3 { top: 32%; left: 10%; width: 18px; height: 18px; animation-delay: 1.8s; }
    .s4 { top: 35%; right: 12%; width: 22px; height: 22px; animation-delay: 0.5s; }
    .s5 { top: 62%; left: 12%; width: 24px; height: 24px; animation-delay: 2.0s; }
    .s6 { top: 65%; right: 14%; width: 18px; height: 18px; animation-delay: 0.9s; }
    .s7 { bottom: 10%; left: 22%; width: 22px; height: 22px; animation-delay: 1.4s; }
    .s8 { bottom: 8%;  right: 25%; width: 20px; height: 20px; animation-delay: 0.7s; }

    /* --- CONTAINER DE FOGOS DE ARTIFÍCIO --- */
    #fireworks-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .firework-burst {
      position: absolute;
      width: 0;
      height: 0;
    }

    .firework-particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ff2a85;
      border-radius: 50%;
      animation: explodeParticle 1s ease-out forwards;
      box-shadow: 0 0 8px #ffcc00;
    }

    @keyframes explodeParticle {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: rotate(var(--angle)) translate(var(--velocity)) scale(0.2);
        opacity: 0;
      }
    }

    /* --- BALÃO DE PENSAMENTO --- */
    .thought-bubble-container {
      position: relative;
      z-index: 12;
      width: 100%;
      max-width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .thought-bubble {
      position: relative;
      width: 100%;
      min-height: 200px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 35px;
      padding: 30px 24px;
      box-shadow: 0 12px 35px rgba(190, 24, 93, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .thought-circle-1 {
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      margin-top: 10px;
      align-self: flex-start;
      margin-left: 50px;
      box-shadow: 0 4px 10px rgba(190, 24, 93, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .thought-circle-2 {
      width: 13px;
      height: 13px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      margin-top: 6px;
      align-self: flex-start;
      margin-left: 36px;
      box-shadow: 0 2px 6px rgba(190, 24, 93, 0.08);
    }

    .text-content {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #374151;
      font-weight: 500;
      transition: opacity 0.3s ease, transform 0.3s ease;
      width: 100%;
    }

    .text-content.fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }

    .text-content.fade-in {
      animation: popIn 0.4s ease-out forwards;
    }

    .tap-hint {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #be185d;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.8;
      animation: pulseHint 2s infinite;
    }

    .progress-counter {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 0.75rem;
      color: #9ca3af;
      font-weight: 600;
    }

    .restart-btn {
      display: none;
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #be185d;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #fbcfe8;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(190, 24, 93, 0.1);
      cursor: pointer;
    }

    /* --- MÁSCARA DE PLANTAS --- */
    .plant-overlay {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffeef2;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }

    .plant-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .plant-cluster {
      position: absolute;
      width: 320px;
      height: 320px;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .plant-cluster-top { top: 15%; }
    .plant-cluster-bottom { bottom: 15%; transform: rotate(180deg); }

    .plant-overlay.open .plant-cluster-top { transform: translateY(-180%) scale(0.7); }
    .plant-overlay.open .plant-cluster-bottom { transform: translateY(180%) rotate(180deg) scale(0.7); }

    .open-btn-container {
      position: relative;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .plant-overlay.open .open-btn-container {
      opacity: 0;
      transform: scale(0.8);
    }

    .open-btn {
      padding: 16px 32px;
      background: #be185d;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(190, 24, 93, 0.35);
      letter-spacing: 0.5px;
      animation: pulseBtn 2s infinite;
      cursor: pointer;
    }

    .open-subtext {
      font-size: 0.85rem;
      color: #be185d;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(6deg); }
      100% { transform: translateY(4px) rotate(-4deg); }
    }

    @keyframes twinkle {
      0% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.15) rotate(45deg); opacity: 1; }
      100% { transform: scale(0.85) rotate(90deg); opacity: 0.5; }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 25px rgba(190, 24, 93, 0.35); }
      50% { transform: scale(1.05); box-shadow: 0 12px 30px rgba(190, 24, 93, 0.5); }
    }
  </style>
</head>
<body>

  <!-- CONTAINER DE FOGOS DE ARTIFÍCIO -->
  <div id="fireworks-container"></div>

  <!-- ELEMENTOS DECORATIVOS -->
  <div class="decor-field">
    
    <!-- 10 FOTOS FLUTUANTES -->
    <img class="floating-photo p1" alt="Foto">
    <img class="floating-photo p2" alt="Foto">
    <img class="floating-photo p3" alt="Foto">
    <img class="floating-photo p4" alt="Foto">
    <img class="floating-photo p5" alt="Foto">
    <img class="floating-photo p6" alt="Foto">
    <img class="floating-photo p7" alt="Foto">
    <img class="floating-photo p8" alt="Foto">
    <img class="floating-photo p9" alt="Foto">
    <img class="floating-photo p10" alt="Foto">

    <!-- FLORES -->
    <svg class="flower f1" viewBox="0 0 32 32"><path class="stem" d="M16 16v12M16 22c-3-1-5-3-5-5" /><path class="leaf" d="M11 17c-2-2-1-5 2-4 2 1 2 4-2 4z" /><circle class="petal-dark" cx="16" cy="11" r="7" /><circle class="petal-mid" cx="12" cy="11" r="5" /><circle class="petal-mid" cx="20" cy="11" r="5" /><circle class="petal-mid" cx="16" cy="7" r="5" /><circle class="petal-mid" cx="16" cy="15" r="5" /><circle class="petal-core" cx="16" cy="11" r="3" /></svg>
    <svg class="flower f2" viewBox="0 0 32 32"><path class="stem" d="M16 14v14M16 22c4-1 6-3 6-6" /><path class="leaf" d="M22 16c2-2 1-5-2-4-2 1-2 4 2 4z" /><path class="petal-dark" d="M16 4c-5 0-8 5-8 9 0 4 3.5 6 8 6s8-2 8-6c0-4-3-9-8-9z" /><path class="petal-mid" d="M16 6c-3 0-5 3-5 6.5s2 4.5 5 4.5 5-1.5 5-4.5S19 6 16 6z" /></svg>
    <svg class="flower f3" viewBox="0 0 32 32"><path class="stem" d="M16 16v12M16 22c-3-1-5-3-5-5" /><circle class="petal-dark" cx="16" cy="11" r="7" /><circle class="petal-core" cx="16" cy="11" r="3" /></svg>
    <svg class="flower f4" viewBox="0 0 32 32"><path class="stem" d="M16 14v14M16 22c4-1 6-3 6-6" /><path class="leaf" d="M22 16c2-2 1-5-2-4-2 1-2 4 2 4z" /><path class="petal-dark" d="M16 4c-5 0-8 5-8 9 0 4 3.5 6 8 6s8-2 8-6c0-4-3-9-8-9z" /></svg>
    <svg class="flower f5" viewBox="0 0 32 32"><path class="stem" d="M16 16v12" /><circle class="petal-dark" cx="16" cy="11" r="7" /><circle class="petal-mid" cx="12" cy="11" r="5" /><circle class="petal-mid" cx="20" cy="11" r="5" /><circle class="petal-core" cx="16" cy="11" r="3" /></svg>
    <svg class="flower f6" viewBox="0 0 32 32"><path class="stem" d="M16 14v14" /><path class="petal-dark" d="M16 4c-5 0-8 5-8 9 0 4 3.5 6 8 6s8-2 8-6c0-4-3-9-8-9z" /></svg>
    <svg class="flower f7" viewBox="0 0 32 32"><path class="stem" d="M16 16v12M16 22c-3-1-5-3-5-5" /><path class="leaf" d="M11 17c-2-2-1-5 2-4 2 1 2 4-2 4z" /><circle class="petal-dark" cx="16" cy="11" r="7" /><circle class="petal-mid" cx="16" cy="7" r="5" /><circle class="petal-core" cx="16" cy="11" r="3" /></svg>
    <svg class="flower f8" viewBox="0 0 32 32"><path class="stem" d="M16 14v14" /><path class="petal-dark" d="M16 4c-5 0-8 5-8 9 0 4 3.5 6 8 6s8-2 8-6c0-4-3-9-8-9z" /></svg>
    <svg class="flower f9" viewBox="0 0 32 32"><path class="stem" d="M16 16v12M16 22c4-1 6-3 6-6" /><circle class="petal-dark" cx="16" cy="11" r="7" /><circle class="petal-core" cx="16" cy="11" r="3" /></svg>
    <svg class="flower f10" viewBox="0 0 32 32"><path class="stem" d="M16 14v14M16 22c-3-1-5-3-5-5" /><path class="leaf" d="M11 17c-2-2-1-5 2-4 2 1 2 4-2 4z" /><path class="petal-dark" d="M16 4c-5 0-8 5-8 9 0 4 3.5 6 8 6s8-2 8-6c0-4-3-9-8-9z" /><path class="petal-mid" d="M16 6c-3 0-5 3-5 6.5s2 4.5 5 4.5 5-1.5 5-4.5S19 6 16 6z" /></svg>

    <!-- BRILHOS -->
    <svg class="sparkle s1 sparkle-gold" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s2 sparkle-white" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s3 sparkle-white" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s4 sparkle-gold" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s5 sparkle-gold" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s6 sparkle-white" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s7 sparkle-white" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
    <svg class="sparkle s8 sparkle-gold" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>
  </div>

  <!-- COBERTURA DE PLANTAS -->
  <div class="plant-overlay" id="plantOverlay" onclick="openSurprise()">
    <svg class="plant-cluster plant-cluster-top" viewBox="0 0 200 200">
      <path d="M100 20 Q120 70 160 80 Q100 100 100 180 Q100 100 40 80 Q80 70 100 20Z" fill="#22c55e" opacity="0.9"/>
      <path d="M100 40 Q130 90 180 110 Q110 120 100 170 Q90 120 20 110 Q70 90 100 40Z" fill="#15803d" opacity="0.95"/>
      <path d="M100 60 Q115 100 145 115 Q105 125 100 160 Q95 125 55 115 Q85 100 100 60Z" fill="#4ade80" opacity="0.9"/>
      <circle cx="100" cy="110" r="22" fill="#be185d" />
      <circle cx="100" cy="110" r="12" fill="#fbcfe8" />
      <circle cx="60" cy="95" r="14" fill="#db2777" />
      <circle cx="140" cy="95" r="14" fill="#db2777" />
    </svg>

    <div class="open-btn-container">
      <button class="open-btn">Abrir Surpresa 💐</button>
      <span class="open-subtext">Toque para ver a mensagem</span>
    </div>

    <svg class="plant-cluster plant-cluster-bottom" viewBox="0 0 200 200">
      <path d="M100 20 Q120 70 160 80 Q100 100 100 180 Q100 100 40 80 Q80 70 100 20Z" fill="#22c55e" opacity="0.9"/>
      <path d="M100 40 Q130 90 180 110 Q110 120 100 170 Q90 120 20 110 Q70 90 100 40Z" fill="#15803d" opacity="0.95"/>
      <path d="M100 60 Q115 100 145 115 Q105 125 100 160 Q95 125 55 115 Q85 100 100 60Z" fill="#4ade80" opacity="0.9"/>
      <circle cx="100" cy="110" r="22" fill="#be185d" />
      <circle cx="100" cy="110" r="12" fill="#fbcfe8" />
      <circle cx="60" cy="95" r="14" fill="#db2777" />
      <circle cx="140" cy="95" r="14" fill="#db2777" />
    </svg>
  </div>

  <!-- BALÃO DE PENSAMENTO CENTRAL -->
  <div class="thought-bubble-container">
    <div class="thought-bubble" id="bubble" onclick="nextBlock()">
      <span class="progress-counter" id="counter">1 / 8</span>
      <div class="text-content fade-in" id="text-display">
        <!-- O texto é inserido via JS -->
      </div>
    </div>
    
    <div class="thought-circle-1"></div>
    <div class="thought-circle-2"></div>

    <div class="tap-hint" id="hint">Toque no balão para continuar ✨</div>
    <button class="restart-btn" id="restart-btn" onclick="restart()">Ler novamente 🔄</button>
  </div>

    let currentIndex = 0;
    let isFinished = false;

    const textDisplay = document.getElementById('text-display');
    const counterDisplay = document.getElementById('counter');
    const hintDisplay = document.getElementById('hint');
    const restartBtn = document.getElementById('restart-btn');
    const plantOverlay = document.getElementById('plantOverlay');

    function openSurprise() {
      plantOverlay.classList.add('open');
      setTimeout(() => {
        plantOverlay.classList.add('hidden');
      }, 800);
    }

    function updateContent() {
      counterDisplay.innerText = `${currentIndex + 1} / ${blocks.length}`;
      const formattedText = blocks[currentIndex].replace(/\n/g, '<br>');
      textDisplay.innerHTML = formattedText;

      textDisplay.classList.remove('fade-out');
      textDisplay.classList.add('fade-in');

      hintDisplay.style.display = 'block';
      restartBtn.style.display = 'none';
    }

    function nextBlock() {
      if (!isFinished) {
        if (currentIndex < blocks.length - 1) {
          textDisplay.classList.remove('fade-in');
          textDisplay.classList.add('fade-out');

          setTimeout(() => {
            currentIndex++;
            updateContent();
          }, 250);
        } else {
          isFinished = true;
          textDisplay.classList.remove('fade-in');
          textDisplay.classList.add('fade-out');

          setTimeout(() => {
            showFinalBirthdayScreen();
          }, 250);
        }
      }
    }

    function triggerFireworks() {
      const container = document.getElementById('fireworks-container');
      container.innerHTML = '';
      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          createFireworkBurst(container);
        }, i * 300);
      }
    }

    function createFireworkBurst(container) {
      const burst = document.createElement('div');
      burst.className = 'firework-burst';
      const x = Math.random() * (window.innerWidth - 100) + 50;
      const y = Math.random() * (window.innerHeight * 0.5) + (window.innerHeight * 0.2);
      burst.style.left = x + 'px';
      burst.style.top = y + 'px';
      
      for (let p = 0; p < 14; p++) {
        const particle = document.createElement('div');
        particle.className = 'firework-particle';
        const angle = (p / 14) * 360;
        const velocity = Math.random() * 80 + 40;
        particle.style.setProperty('--angle', angle + 'deg');
        particle.style.setProperty('--velocity', velocity + 'px');
        
        const colors = ['#ff2a85', '#ffcc00', '#ec4899', '#ffffff', '#f43f5e', '#a855f7'];
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        burst.appendChild(particle);
      }
      container.appendChild(burst);
      setTimeout(() => burst.remove(), 1200);
    }

    function restart() {
      currentIndex = 0;
      isFinished = false;
      document.getElementById('fireworks-container').innerHTML = '';
      updateContent();
    }

    updateContent();
  </script>

</body>
</html>
